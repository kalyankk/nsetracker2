<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NSE Trader Mobile - Live Charts & Breakout Terminal</title>
    <meta name="description" content="Real-time NSE India stock tracking, Inside Bar breakout scanner, EMA momentum, and RSI divergence alerts for mobile traders." />
    
    <!-- Android / PWA Mobile Configuration -->
    <meta name="theme-color" content="#0b0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="NSE Trader" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Web App / Home Screen tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NSE Trader" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- OpenGraph / Social -->
    <meta property="og:title" content="NSE Trader Mobile - Live Charts & Breakout Terminal" />
    <meta property="og:description" content="Real-time NSE India stock tracking, Inside Bar breakout scanner, EMA momentum, and RSI divergence alerts for mobile traders." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
      // Register service worker for Android PWA installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-[#0b0f17] text-slate-100 overscroll-none select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
